name: release

# Publishing a new version:  git tag v1.3.0 && git push --tags
# Installed apps find the release on their next daily check and update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Tag must look like v1.2.3, got ${{ github.ref_name }}" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test tests/KodizSignage.Tests/KodizSignage.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/KodizSignage/KodizSignage.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} -o publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }

      - name: UI smoke test
        shell: pwsh
        run: |
          $env:KODIZ_SIGNAGE_DATA_DIR = Join-Path $env:RUNNER_TEMP "kodiz-smoke"
          $p = Start-Process -FilePath publish/KodizSignage.exe -ArgumentList "--smoke-test" -PassThru -Wait
          Get-ChildItem "$env:KODIZ_SIGNAGE_DATA_DIR/logs" -Filter *.log | Get-Content
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Checksum and notices
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/KodizSignage.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KodizSignage.exe" | Out-File -Encoding ascii -NoNewline publish/KodizSignage.exe.sha256
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt publish/THIRD-PARTY-NOTICES.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: Kodiz Signage ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            publish/KodizSignage.exe
            publish/KodizSignage.exe.sha256
            publish/LICENSE.txt
            publish/THIRD-PARTY-NOTICES.txt
